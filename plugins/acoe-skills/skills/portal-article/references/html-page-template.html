<!-- Hosted HTML page template for the html-pages container.
     File name = URL: html-pages/my-page.html is served at /my-page.
     The page must be fully self-contained: inline all CSS/JS, embed images
     as data: URIs. The portal:* meta tags feed the derived /sites/index.json
     listing; without them the <title> tag and blob upload date are used. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Page Title</title>

  <meta name="portal:title"    content="My Page Title">
  <meta name="portal:title-cz" content="Název mé stránky">
  <meta name="portal:desc"     content="One-sentence description for the listing.">
  <meta name="portal:desc-cz"  content="Jednovětný popis pro výpis.">
  <meta name="portal:tag"      content="Strategy">
  <meta name="portal:added"    content="2026-08-17">

  <style>
    /* all styles inline */
  </style>
</head>
<body>
  <!-- content -->
</body>
</html>
