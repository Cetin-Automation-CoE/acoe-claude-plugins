<!-- Hosted HTML page template for the html-pages container.
     File name = URL: html-pages/my-page.html is served raw at /my-page, inside
     the portal chrome at /presentations/my-page/, and listed under
     Presentations automatically. The <title> below is the listing title and
     the upload date is its date; nothing else is read from the page.
     The page must be fully self-contained: inline all CSS/JS, embed images
     as data: URIs. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Page Title</title>

  <style>
    /* all styles inline */
  </style>
</head>
<body>
  <!-- content -->
</body>
</html>
