# Header / Rail / Main frame — `--frame headerrailmain` (or model.yaml's
# `frame: headerrailmain`). Reference layout, copied to Frame.pa.yaml: adapt
# the header/rail content for your app, but keep the SIZING formula — that is
# the part this file exists to get right.
#
# Sizing:
#   - con_Frame_Header is PINNED (FillPortions: =0) at the top with an
#     explicit Height — the same rule as the headermainfooter frame.
#   - con_Frame_Body sits below it; its own Height is Parent.Height minus the
#     header's own Height, read off the header, never a re-typed literal.
#   - Inside con_Frame_Body (a HORIZONTAL auto-layout container), con_Frame_
#     Rail is PINNED (FillPortions: =0) with an explicit WIDTH — the main
#     axis is horizontal here, so Height would not satisfy Rule 1, only
#     Width does (check_layout.py's Rule 1 is axis-specific on purpose).
#     con_Frame_Main is the one flexible region (FillPortions: =1).
#
# Not wired into emit_screens.py — Controller Ruling 3's hand-authoring
# library pattern applies here too: this is a starting point to adapt, not a
# generator output.
Screens:
  FrameHeaderRailMain:
    Properties:
      Fill: =constReactGray.RGBA
    Children:
      - con_Frame_Header:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            BorderStyle: =BorderStyle.None
            Fill: =constPrimaryColor.RGBA
            FillPortions: =0
            Height: =constStyle.Header.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            Width: =Parent.Width

      - con_Frame_Body:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            BorderStyle: =BorderStyle.None
            Height: =Parent.Height - con_Frame_Header.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            Width: =Parent.Width
            Y: =con_Frame_Header.Height
          Children:
            - con_Frame_Rail:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderStyle: =BorderStyle.None
                  Fill: =constPaperColor.RGBA
                  FillPortions: =0
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  Width: =240

            - con_Frame_Main:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderStyle: =BorderStyle.None
                  FillPortions: =1
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutOverflowY: =LayoutOverflow.Scroll
