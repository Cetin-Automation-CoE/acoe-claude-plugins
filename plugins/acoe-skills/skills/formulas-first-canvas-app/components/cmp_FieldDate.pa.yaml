# Date field: a label over a ModernDatePicker. HAND-AUTHORING LIBRARY —
# emit_screens.py emits its form fields inline and is not wired to this. Drop
# an instance onto a form screen yourself when you want it.
#
#   - cmp_Form_DueDateField:
#       Control: CanvasComponent
#       ComponentName: cmp_FieldDate
#       Properties:
#         Label: ="Due date"
#         Value: =locRecord.DueDate
#         Required: =true
#         Placeholder: ="Pick a date"
#         OnChange: =UpdateContext({locDirty: true})
#         Width: =Parent.Width
#
# Read cmp_FieldDate.Output for the current value. ModernDatePicker has no
# Required property (control-contracts.yaml) — Required only marks the label
# here; wire your own validation off Output the way lbl_Form_Errors does.
#
# ONE scalar output (DateAndTime) of a known type. Do NOT fold this and its
# three siblings (cmp_FieldText, cmp_FieldChoice, cmp_FieldNumber) into a
# single generic cmp_Field switching over control types and returning a
# Record — that is exactly the whole-record output shape that caused a
# 247-error type-cycle cascade (see references/powerfx-limits.md,
# "Whole-record output resolution").
#
# Requires: constStyle
ComponentDefinitions:
  cmp_FieldDate:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      Label:
        PropertyKind: Input
        DisplayName: Label
        Description: Text shown above the input
        DataType: Text
        Default: ="Label"
      Value:
        PropertyKind: Input
        DisplayName: Value
        Description: Initial date
        DataType: DateAndTime
        Default: =Blank()
      Required:
        PropertyKind: Input
        DisplayName: Required
        Description: Shows a required marker on the label (ModernDatePicker
          has no Required property to bind to — validate off Output instead)
        DataType: Boolean
        Default: =false
      Placeholder:
        PropertyKind: Input
        DisplayName: Placeholder
        Description: Hint text inside the empty input
        DataType: Text
        Default: =""
      OnChange:
        PropertyKind: Event
        DisplayName: OnChange
        Description: Raised when the date changes, matching ModernDatePicker's own OnChange
        ReturnType: None
        Default: =false
      Output:
        PropertyKind: Output
        DisplayName: Output
        Description: The selected date. Anchored to one control's
          .SelectedDate — never resolve this component as a whole record
          (powerfx-limits.md).
        DataType: DateAndTime
    Properties:
      Height: =constStyle.Label.Height.Small + constStyle.Label.Height.Medium + constStyle.Spacing.XS
      Output: =dp_FieldDate_Input.SelectedDate
      Width: =280
    Children:
      - con_FieldDate:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            BorderStyle: =BorderStyle.None
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =constStyle.Spacing.XS
            Width: =Parent.Width
          Children:
            - lbl_FieldDate_Label:
                Control: ModernText
                Properties:
                  AutoHeight: =true
                  FontWeight: =FontWeight.Semibold
                  Size: =constStyle.BasicStyle.FontSize.Small
                  Text: =cmp_FieldDate.Label & If(cmp_FieldDate.Required, " *", "")
            - dp_FieldDate_Input:
                Control: ModernDatePicker
                Properties:
                  AccessibleLabel: =cmp_FieldDate.Label
                  DefaultDate: =cmp_FieldDate.Value
                  DisplayMode: =cmp_FieldDate.DisplayMode
                  Height: =constStyle.Label.Height.Medium
                  OnChange: =cmp_FieldDate.OnChange()
                  Placeholder: =cmp_FieldDate.Placeholder
