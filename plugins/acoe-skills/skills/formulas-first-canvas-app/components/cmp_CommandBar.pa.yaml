# Right-aligned row of circular action buttons. Each button is independently
# gated by a Can* input, so one component serves every screen's toolbar and a
# screen shows only the verbs its user is allowed.
#
#   - cmp_List_Commands:
#       Control: CanvasComponent
#       ComponentName: cmp_CommandBar
#       Properties:
#         CanAdd: =funcCanWrite()
#         CanEdit: =false
#         CanDelete: =false
#         CanRemoveFilters: =!IsEmpty(colFilters)
#         OnAdd: =Set(glSelectedKey, ""); Navigate(FormScreen)
#         OnRemoveFilter: =Clear(colFilters)
#
# Gate the Can* inputs on the SAME expression that guards the underlying
# function. A hidden button is not a permission check — it is a hidden button.
#
# Requires: constPrimaryColor, constSecondaryColor, constStyle, constTransparent
ComponentDefinitions:
  cmp_CommandBar:
    DefinitionType: CanvasComponent
    # PORTED CHANGE: AccessAppScope was absent, so this component could not read
    # constStyle and carried its own literals.
    AccessAppScope: true
    CustomProperties:
      CanAdd:
        PropertyKind: Input
        DisplayName: CanAdd
        Description: Show the create action
        DataType: Boolean
        Default: =true
      CanChangeStatus:
        PropertyKind: Input
        DisplayName: CanChangeStatus
        Description: Show the status action
        DataType: Boolean
        Default: =false
      CanConfirm:
        PropertyKind: Input
        DisplayName: CanConfirm
        Description: Show the confirm action
        DataType: Boolean
        Default: =false
      CanCustom:
        PropertyKind: Input
        DisplayName: CanCustom
        Description: Show the app-specific action defined by CustomIcon / OnCustom
        DataType: Boolean
        Default: =false
      CanDelete:
        PropertyKind: Input
        DisplayName: CanDelete
        Description: Show the destructive action
        DataType: Boolean
        Default: =false
      CanEdit:
        PropertyKind: Input
        DisplayName: CanEdit
        Description: Show the edit action
        DataType: Boolean
        Default: =false
      CanRemoveFilters:
        PropertyKind: Input
        DisplayName: CanRemoveFilters
        Description: Show clear-filters — bind to !IsEmpty(colFilters), not to true
        DataType: Boolean
        Default: =false
      CanShare:
        PropertyKind: Input
        DisplayName: CanShare
        Description: Show the share / open-external action
        DataType: Boolean
        Default: =false
      CustomColor:
        PropertyKind: Input
        DisplayName: CustomColor
        Description: Base palette colour for the custom action
        DataType: Color
        Default: =constPrimaryColor.RGBA
      CustomIcon:
        PropertyKind: Input
        DisplayName: CustomIcon
        Description: Fluent icon name for the custom action
        DataType: Text
        Default: ="Link"
      DestructiveColor:
        PropertyKind: Input
        DisplayName: DestructiveColor
        Description: Base palette colour for delete and clear-filters
        DataType: Color
        Default: =constSecondaryColor.RGBA
      OnAdd:
        PropertyKind: Event
        DisplayName: OnAdd
        Description: Raised by the create action
        ReturnType: None
        Default: =false
      OnChangeStatus:
        PropertyKind: Event
        DisplayName: OnChangeStatus
        Description: Raised by the status action
        ReturnType: None
        Default: =false
      OnConfirm:
        PropertyKind: Event
        DisplayName: OnConfirm
        Description: Raised by the confirm action
        ReturnType: None
        Default: =false
      OnCustom:
        PropertyKind: Event
        DisplayName: OnCustom
        Description: Raised by the custom action
        ReturnType: None
        Default: =false
      OnDelete:
        PropertyKind: Event
        DisplayName: OnDelete
        Description: Raised by the destructive action — confirm before acting
        ReturnType: None
        Default: =false
      OnEdit:
        PropertyKind: Event
        DisplayName: OnEdit
        Description: Raised by the edit action
        ReturnType: None
        Default: =false
      OnRemoveFilter:
        PropertyKind: Event
        DisplayName: OnRemoveFilter
        Description: Raised by clear-filters
        ReturnType: None
        Default: =false
      OnShare:
        PropertyKind: Event
        DisplayName: OnShare
        Description: Raised by the share action
        ReturnType: None
        Default: =false
      ShowCommandBar:
        PropertyKind: Input
        DisplayName: ShowCommandBar
        Description: Hide the whole bar in one binding
        DataType: Boolean
        Default: =true
      Size:
        PropertyKind: Input
        DisplayName: Size
        Description: Diameter of each round button
        DataType: Number
        Default: =30
    Properties:
      Height: =50
      Width: =250
    Children:
      - con_CommandBar:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            BorderColor: =constTransparent.RGBA
            BorderStyle: =BorderStyle.None
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =constStyle.Spacing.S
            LayoutJustifyContent: =LayoutJustifyContent.End
            Visible: =cmp_CommandBar.ShowCommandBar
            Width: =Parent.Width
          Children:
            - btn_CommandBar_RemoveFilters:
                Control: Button
                Properties:
                  AccessibleLabel: ="Clear all filters"
                  Appearance: ='ButtonCanvas.Appearance'.Primary
                  BasePaletteColor: =cmp_CommandBar.DestructiveColor
                  BorderRadius: =Self.Height / 2
                  Height: =cmp_CommandBar.Size
                  Icon: ="Filter"
                  IconStyle: ='ButtonCanvas.IconStyle'.Filled
                  Layout: ='ButtonCanvas.Layout'.IconOnly
                  OnSelect: =cmp_CommandBar.OnRemoveFilter()
                  Text: =""
                  Visible: =cmp_CommandBar.CanRemoveFilters
                  Width: =cmp_CommandBar.Size
            - btn_CommandBar_ChangeStatus:
                Control: Button
                Properties:
                  AccessibleLabel: ="Change status"
                  BorderRadius: =Self.Height / 2
                  Height: =cmp_CommandBar.Size
                  Icon: ="Eye"
                  IconStyle: ='ButtonCanvas.IconStyle'.Filled
                  Layout: ='ButtonCanvas.Layout'.IconOnly
                  OnSelect: =cmp_CommandBar.OnChangeStatus()
                  Text: =""
                  Visible: =cmp_CommandBar.CanChangeStatus
                  Width: =cmp_CommandBar.Size
            - btn_CommandBar_Share:
                Control: Button
                Properties:
                  AccessibleLabel: ="Share"
                  BorderRadius: =Self.Height / 2
                  Height: =cmp_CommandBar.Size
                  Icon: ="Open"
                  IconStyle: ='ButtonCanvas.IconStyle'.Filled
                  Layout: ='ButtonCanvas.Layout'.IconOnly
                  OnSelect: =cmp_CommandBar.OnShare()
                  Text: =""
                  Visible: =cmp_CommandBar.CanShare
                  Width: =cmp_CommandBar.Size
            - btn_CommandBar_Add:
                Control: Button
                Properties:
                  AccessibleLabel: ="New item"
                  BorderRadius: =Self.Height / 2
                  Height: =cmp_CommandBar.Size
                  Icon: ="Add"
                  IconStyle: ='ButtonCanvas.IconStyle'.Filled
                  Layout: ='ButtonCanvas.Layout'.IconOnly
                  OnSelect: =cmp_CommandBar.OnAdd()
                  Text: =""
                  Visible: =cmp_CommandBar.CanAdd
                  Width: =cmp_CommandBar.Size
            - btn_CommandBar_Edit:
                Control: Button
                Properties:
                  AccessibleLabel: ="Edit"
                  BorderRadius: =Self.Height / 2
                  Height: =cmp_CommandBar.Size
                  Icon: ="Edit"
                  IconStyle: ='ButtonCanvas.IconStyle'.Filled
                  Layout: ='ButtonCanvas.Layout'.IconOnly
                  OnSelect: =cmp_CommandBar.OnEdit()
                  Text: =""
                  Visible: =cmp_CommandBar.CanEdit
                  Width: =cmp_CommandBar.Size
            - btn_CommandBar_Delete:
                Control: Button
                Properties:
                  AccessibleLabel: ="Delete"
                  Appearance: ='ButtonCanvas.Appearance'.Primary
                  BasePaletteColor: =cmp_CommandBar.DestructiveColor
                  BorderRadius: =Self.Height / 2
                  Height: =cmp_CommandBar.Size
                  Icon: ="Delete"
                  IconStyle: ='ButtonCanvas.IconStyle'.Filled
                  Layout: ='ButtonCanvas.Layout'.IconOnly
                  OnSelect: =cmp_CommandBar.OnDelete()
                  Text: =""
                  Visible: =cmp_CommandBar.CanDelete
                  Width: =cmp_CommandBar.Size
            - btn_CommandBar_Confirm:
                Control: Button
                Properties:
                  AccessibleLabel: ="Confirm"
                  BorderRadius: =Self.Height / 2
                  Height: =cmp_CommandBar.Size
                  Icon: ="Checkmark"
                  IconStyle: ='ButtonCanvas.IconStyle'.Filled
                  Layout: ='ButtonCanvas.Layout'.IconOnly
                  OnSelect: =cmp_CommandBar.OnConfirm()
                  Text: =""
                  Visible: =cmp_CommandBar.CanConfirm
                  Width: =cmp_CommandBar.Size
            - btn_CommandBar_Custom:
                Control: Button
                Properties:
                  AccessibleLabel: ="More"
                  BasePaletteColor: =cmp_CommandBar.CustomColor
                  BorderRadius: =Self.Height / 2
                  Height: =cmp_CommandBar.Size
                  Icon: =cmp_CommandBar.CustomIcon
                  IconStyle: ='ButtonCanvas.IconStyle'.Filled
                  Layout: ='ButtonCanvas.Layout'.IconOnly
                  OnSelect: =cmp_CommandBar.OnCustom()
                  Text: =""
                  Visible: =cmp_CommandBar.CanCustom
                  Width: =cmp_CommandBar.Size
