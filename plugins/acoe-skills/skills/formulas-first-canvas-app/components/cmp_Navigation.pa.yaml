# Icon rail that expands to a labelled menu. Reads the constScreens REGISTRY —
# adding a screen to the app's menu is a row in that table, not an edit here.
#
#   - cmp_Screen_Navigation:
#       Control: CanvasComponent
#       ComponentName: cmp_Navigation
#       Properties:
#         Navigation: =locNavigation          # expanded / collapsed
#         OnClose: =UpdateContext({locNavigation: false})
#         OnBack: =funcGoBack()
#         Height: =Parent.Height - cmp_Screen_Header.Height
#
# Only rows with Type = enumScreenType.List appear. Form rows are reachable by
# navigation from a list, so they carry Group = "" and stay out of the menu.
#
# Requires: constScreens, enumScreenType, constPrimaryColor, constPaperColor,
#           constReactGray, constStyle, constTransparent, constBackdropColor,
#           constBorderRadius
ComponentDefinitions:
  cmp_Navigation:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      AllowBack:
        PropertyKind: Input
        DisplayName: AllowBack
        Description: Show the back affordance at the top of the rail
        DataType: Boolean
        Default: =false
      Navigation:
        PropertyKind: Input
        DisplayName: Navigation
        Description: Expanded (labels visible) when true, icon rail when false
        DataType: Boolean
        Default: =false
      OnBack:
        PropertyKind: Event
        DisplayName: OnBack
        Description: Raised by the back button — normally funcGoBack()
        ReturnType: None
        Default: =false
      OnClose:
        PropertyKind: Event
        DisplayName: OnClose
        Description: Raised when the rail should collapse
        ReturnType: None
        Default: =false
      Screens:
        PropertyKind: Input
        DisplayName: Screens
        Description: The routing registry. Defaults to the app-wide constScreens.
        DataType: Table
        # CORRECTED 2026-09-07 (fifth run): this used to default to the bare
        # reference `=constScreens`, on the strength of a fourth-run claim
        # that shape was "proven live". A cold coauthoring session (the only
        # kind this skill's compile-error playbook says can be trusted — see
        # its top note) disproved that claim: retested on its own, with no
        # `cmp_FilterButton` blank default left in the same push to blame,
        #   Default: =constScreens                                    -> 2 errors
        #     ("The table passed in has none of the expected columns" on
        #     EVERY cmp_*_Navigation instance — the same shape the third run
        #     saw; the fourth run's "that was only ever a cascade from an
        #     unrelated component" theory does not hold as a general claim)
        #   Default: =Table({...}) with no Screen column at all       -> 10 errors
        #   Default: =Table({Screen: <a real screen>, DisplayName: "",
        #             Icon: "", Entity: "", Type: "", Group: "",
        #             BackLabel: ""})                                  -> 0 errors
        # Full trail: references/compile-error-playbook.md.
        #
        # Do NOT "fix" this to a literal `Table(...)` default containing
        # `App.ActiveScreen` — that CRASHES the validator outright
        # ("Validation FAILED with no diagnostics"). A component
        # custom-property `Default` is evaluated in isolated component
        # scope; `App.ActiveScreen` (or any app-scope reference) inside it
        # is not merely a type error, it is the specific shape that takes
        # down the validator with no attributable diagnostic.
        #
        # The literal below names ListScreen — the legacy `--name`
        # template's own screen, real and defined in that build, so this
        # shipped default is correct for it unchanged. A --model build's
        # generator (scripts/new_app.py, Ruling 18) rewrites the Screen
        # column's value on the COPY it writes to that build's own real
        # first screen (DashboardScreen when the model has one, else the
        # first entity's list screen) — via `_replace_once`, which requires
        # this exact line to appear exactly once below, so never duplicate
        # its literal shape elsewhere in this file — never ship a
        # model-driven app with a component default that references a
        # screen it does not define.
        Default: |-
          =Table({Screen: ListScreen, DisplayName: "", Icon: "", Entity: "", Type: "", Group: "", BackLabel: ""})
    Properties:
      Fill: =If(cmp_Navigation.Navigation, constBackdropColor.RGBA, constTransparent.RGBA)
      Width: =If(cmp_Navigation.Navigation, 250, 60)
    Children:
      - con_Navigation:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            BorderColor: =constTransparent.RGBA
            BorderStyle: =BorderStyle.None
            DropShadow: =DropShadow.Bold
            Fill: =constReactGray.RGBA
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            # Scroll goes on the scrolling container itself. A flexible child
            # absorbs the parent's height, so Scroll set on the parent never fires.
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingLeft: =If(cmp_Navigation.Navigation, constStyle.Spacing.L, 0)
            PaddingTop: =constStyle.Spacing.M
            RadiusBottomRight: =If(cmp_Navigation.Navigation, constStyle.Spacing.XS, 0)
            RadiusTopRight: =If(cmp_Navigation.Navigation, constStyle.Spacing.XS, 0)
            Width: =If(cmp_Navigation.Navigation, 250, 60)
          Children:
            - con_Navigation_Back:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  BorderColor: =constTransparent.RGBA
                  BorderStyle: =BorderStyle.None
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =50
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =constStyle.Spacing.S
                  Visible: =cmp_Navigation.AllowBack
                  Width: =Parent.Width
                Children:
                  - btn_Navigation_Back:
                      Control: Button
                      Properties:
                        AccessibleLabel: ="Back"
                        Appearance: ='ButtonCanvas.Appearance'.Subtle
                        BorderRadius: =constBorderRadius
                        Height: =40
                        Icon: ="ArrowReset"
                        IconStyle: ='ButtonCanvas.IconStyle'.Filled
                        Layout: ='ButtonCanvas.Layout'.IconOnly
                        OnSelect: =cmp_Navigation.OnBack()
                        Text: ="Back"
                        Width: =32
                  - lbl_Navigation_Back:
                      Control: ModernText
                      Properties:
                        Color: =constPrimaryColor.RGBA
                        FontWeight: =FontWeight.Bold
                        Size: =constStyle.BasicStyle.FontSize.Small
                        Text: ="Back"
                        Visible: =cmp_Navigation.Navigation
                        Width: =96
            - gal_Navigation:
                Control: Gallery
                Variant: Vertical
                Properties:
                  AccessibleLabel: ="Main navigation"
                  BorderColor: =constTransparent.RGBA
                  BorderStyle: =BorderStyle.None
                  DelayItemLoading: =false
                  # Leaf control inside an AutoLayout container: without this it
                  # defaults to FillPortions 0 and collapses to the ~200px control
                  # default (the guard's I1 finding — same defect class as
                  # gal_List_Items, just not visible until the parser could see
                  # past this control's Variant: line).
                  FillPortions: =1
                  # The registry drives the menu. No Switch, no per-screen edit.
                  Items: =Filter(cmp_Navigation.Screens, Type = enumScreenType.List)
                  LayoutMinWidth: =Parent.Width
                  LoadingSpinner: =LoadingSpinner.None
                  TemplatePadding: =0
                  TemplateSize: =50
                Children:
                  - con_Navigation_Screen:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =constTransparent.RGBA
                        BorderStyle: =BorderStyle.None
                        DropShadow: =DropShadow.None
                        Height: =Parent.TemplateHeight - 2 * Self.Y
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =constStyle.Spacing.S
                        RadiusBottomLeft: =constBorderRadius
                        RadiusBottomRight: =constBorderRadius
                        RadiusTopLeft: =constBorderRadius
                        RadiusTopRight: =constBorderRadius
                        Width: =Parent.TemplateWidth
                        Y: =5
                      Children:
                        # ORDER IS LOAD-BEARING, and it is the REVERSE of what
                        # the rendered result suggests. With btn_Navigation
                        # written first, Power Apps laid the LABEL out first and
                        # put the icon after it — measured twice against live
                        # renders (2026-09-08). Consequence: with the label
                        # holding the first 96px, the 32px icon started at ~136px,
                        # which is outside the COLLAPSED rail's 60px width, so a
                        # collapsed rail rendered as an empty grey strip. That was
                        # the "navigation is empty" defect.
                        #
                        # Writing the label first therefore renders the ICON first,
                        # which is what an icon rail needs and what the reference
                        # app shows. Why the order inverts is NOT understood — do
                        # not "tidy" these two back into alphabetical order without
                        # re-checking a live render of the collapsed rail.
                        - lbl_Navigation_DisplayName:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: =Self.Text
                              Color: |-
                                =If(
                                    ThisItem.Screen.Name = App.ActiveScreen.Name,
                                    constPrimaryColor.RGBA,
                                    constStyle.BasicStyle.FontColor
                                )
                              # FIXED, not flexible. As the ONE flexible child of
                              # a 250px expanded row this label absorbed every
                              # spare pixel and drove btn_Navigation's fixed 32px
                              # to the far edge of the rail — icon and label ~190px
                              # apart, with the icon clipped against the content
                              # card (live 2026-09-08). With both children fixed the
                              # row packs 32 + gap + 96 from the start, so the icon
                              # and its label sit together.
                              FillPortions: =0
                              FontWeight: =FontWeight.Bold
                              Height: =Parent.Height
                              # ZERO width when the rail is collapsed. At a fixed
                              # 96px the label consumed the whole 60px collapsed
                              # rail and pushed the 32px icon out of view, so a
                              # collapsed rail rendered as a blank strip — the
                              # "collapsed menu not showing icons" defect. Blanking
                              # the text alone was not enough: the label still held
                              # its 96px of layout.
                              LayoutMinWidth: =If(cmp_Navigation.Navigation, 96, 0)
                              Size: =constStyle.BasicStyle.FontSize.Small
                              # Blank the text rather than toggle Visible: an
                              # invisible child is dropped from auto-layout
                              # ENTIRELY, so the collapsed rail would lose the
                              # slot this label holds rather than just hide its
                              # text. (That is check_layout.py's Rule 4, which
                              # only FLAGS flexible children — but the underlying
                              # engine behaviour applies to fixed ones too, which
                              # is why blanking stays the right call now that
                              # FillPortions is 0.) btn_Navigation's
                              # own AccessibleLabel already carries the name
                              # when collapsed, so blanking here loses nothing.
                              Text: =If(cmp_Navigation.Navigation, ThisItem.DisplayName, "")
                              Width: =If(cmp_Navigation.Navigation, 96, 0)
                        - btn_Navigation:
                            Control: Button
                            Properties:
                              AccessibleLabel: =ThisItem.DisplayName
                              Align: =Align.Center
                              # Active state compares the registry's Screen to the
                              # live screen — no global to keep in sync.
                              Appearance: |-
                                =If(
                                    ThisItem.Screen.Name = App.ActiveScreen.Name,
                                    'ButtonCanvas.Appearance'.Primary,
                                    'ButtonCanvas.Appearance'.Outline
                                )
                              BasePaletteColor: =constPrimaryColor.RGBA
                              BorderRadius: =constBorderRadius
                              FontColor: |-
                                =If(
                                    ThisItem.Screen.Name = App.ActiveScreen.Name,
                                    constPaperColor.RGBA,
                                    constPrimaryColor.RGBA
                                )
                              Height: =40
                              Icon: =ThisItem.Icon
                              IconStyle: ='ButtonCanvas.IconStyle'.Filled
                              Layout: ='ButtonCanvas.Layout'.IconOnly
                              OnSelect: |-
                                =cmp_Navigation.OnClose();
                                Navigate(ThisItem.Screen)
                              Text: =ThisItem.DisplayName
                              Width: =32
